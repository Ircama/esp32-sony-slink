[platformio]
src_dir = main
boards_dir = boards

[env]
extra_scripts = pre:tools/gen_web.py
board_build.partitions = partitions.csv
board_upload.maximum_size = 1835008

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; ESP32-C6: the first target with WiFi 6, so the only one where Target Wake Time (TWT) can work (see net.c)
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

; ESP32-H2: no WiFi (BLE 5 + 802.15.4). USB serial + BLE only: no web portal, TCP console or MQTT. See docs/en/ESP32-H2.md
[env:esp32h2]
platform = espressif32
board = esp32-h2-devkitm-1
framework = espidf
monitor_speed = 115200
platform_packages = toolchain-riscv32-esp
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults
