# Builds the firmware for every supported chip with ESP-IDF.
#   - every push / pull request / manual run: build and keep the files as workflow artifacts
#   - a tag "v*" (git tag v1.2 && git push origin v1.2): also publishes a GitHub release with the files below, which is where the
#     device downloads its updates from ("OTA UPDATE", or Settings > Firmware update):
#       slink-<chip>.bin           application image: what the over-the-air update installs (the same file can be pushed with tools/ota_push.py)
#       slink-<chip>-factory.bin   bootloader + partition table + application, for the first flash over USB (esptool write_flash 0x0 ...)
#       SHA256SUMS.txt
#   The ESP32-H2 has no WiFi: its files are for USB flashing only.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "README.md", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c3, esp32c5, esp32c6, esp32h2, esp32s3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                       # the tags give the firmware version (git describe)
      - name: Build ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: bash tools/ci_build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: out/*.bin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: firmware-*
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
