<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Manuale</title>
    <style>html.vdark, html.vdark body { background: #0c0d10; color: #ecebe6; color-scheme: dark; }</style>
    <script>
        /* theme chosen by the app (?theme=dark|light): set before the first paint, so there is no light flash */
        (function () {
            var dark = /[?&]theme=dark/.test(location.search);
            if (dark) document.documentElement.classList.add('vdark');
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            window.__darkInit = dark;
        })();
    </script>

    <!-- Preconnessioni: riducono la latenza verso le CDN usate dal viewer -->
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Avvia in parallelo i moduli markdown-it e i plugin -->
    <link rel="modulepreload" href="https://esm.sh/js-yaml@4">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-abbr@2.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-anchor@9.2.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-deflist@3.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-emoji@3.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-footnote@4.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-ins@4.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-mark@4.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-sub@2.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-sup@2.0.0">
    <link rel="modulepreload" href="https://esm.sh/markdown-it-task-lists@2.1.1">
    <link rel="modulepreload" href="https://esm.sh/markdown-it@14.1.0">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet"
        id="md-style" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
    <script>if (window.__darkInit) document.getElementById("md-style").href = document.getElementById("md-style").href.replace("-light", "-dark");</script>
    <!-- Highlight.js CSS per GitHub theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
        id="highlight-style">
    <script>if (window.__darkInit) document.getElementById("highlight-style").href = document.getElementById("highlight-style").href.replace("github.min", "github-dark.min");</script>

    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>

    <style>
        /* ── Sidebar custom styling ────────────────────── */
        :root {
            --sidebar-w: 260px;
        }

        .bd-sidebar {
            width: var(--sidebar-w) !important;
            min-width: 150px;
            max-width: 50vw;
            flex: 0 0 var(--sidebar-w) !important;
            height: calc(100vh - 52px);
            /* Flex column: search fixed at top, toc-nav scrolls below */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* sidebar itself does NOT scroll */
            position: sticky;
            top: 52px;
            border-right: none;
            background-color: #f8f9fa;
            z-index: 1000;
        }

        /* Resize handle on the right edge of the sidebar */
        .resize-handle {
            width: 9px;
            cursor: col-resize;
            touch-action: none;
            background: linear-gradient(90deg, transparent 3px, rgba(128, 128, 128, .45) 3px, rgba(128, 128, 128, .45) 5px, transparent 5px);
            flex-shrink: 0;
            position: relative;
            z-index: 1001;
            transition: background .15s;
        }

        .resize-handle:hover,
        .resize-handle.active {
            background: linear-gradient(90deg, rgba(128, 128, 128, .15) 0, rgba(128, 128, 128, .15) 3px, var(--va, #e1b66a) 3px, var(--va, #e1b66a) 6px, rgba(128, 128, 128, .15) 6px);
        }

        /* Search stays pinned at the top */
        .bd-sidebar-search {
            flex-shrink: 0;
            padding: 1rem;
        }

        /* TOC list fills the remaining height and scrolls */
        #toc-nav {
            flex: 1 1 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 2rem;
        }

        /* ── Sidebar TOC links ─────────────────────────── */
        /* Base sidebar link: visual defaults only — padding/font/margin handled by toc-hX */
        .bd-sidebar a {
            color: rgba(0, 0, 0, .65);
            text-decoration: none;
            display: block;
            border-radius: 4px;
            transition: background .15s, color .15s;
        }

        /* Override Bootstrap's .nav-link padding via CSS variables + !important */
        #toc-nav a.nav-link {
            --bs-nav-link-padding-x: 0;
            --bs-nav-link-padding-y: 0;
            padding: .30rem .75rem !important;
            color: rgba(0, 0, 0, .65) !important;
            text-decoration: none !important;
            display: block;
            line-height: 1.45 !important;
            word-break: break-word;
            border-radius: 4px;
            transition: background .15s, color .15s;
        }

        #toc-nav a.nav-link.toc-hidden {
            display: none !important;
        }

        #toc-nav a.nav-link:hover,
        #toc-nav a.nav-link:focus {
            color: rgba(0, 0, 0, .9) !important;
            background-color: rgba(225, 182, 106, .1) !important;
        }

        #toc-nav a.nav-link.active {
            font-weight: 600 !important;
            color: #0d0e11 !important;
            background-color: rgba(13, 14, 17, .07) !important;
            border-left: 3px solid #0d0e11 !important;
        }

        /* H2 = capitoli principali */
        #toc-nav a.nav-link.toc-h2 {
            padding: .35rem .75rem .35rem 0.5rem !important;
            font-size: .84rem !important;
            font-weight: 600 !important;
            color: rgba(0, 0, 0, .85) !important;
            margin-top: 0.5rem !important;
            margin-bottom: 0 !important;
        }

        /* H3 = sottosezioni: indentate, leggermente più compatte */
        #toc-nav a.nav-link.toc-h3 {
            padding: .25rem .75rem .25rem 1.6rem !important;
            font-size: .80rem !important;
            font-weight: 400 !important;
            color: rgba(0, 0, 0, .62) !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
        }

        /* H4 = sotto-sottosezioni: molto indentate, compatte, italic */
        #toc-nav a.nav-link.toc-h4 {
            padding: .18rem .75rem .18rem 2.8rem !important;
            font-size: .75rem !important;
            font-weight: 400 !important;
            font-style: italic !important;
            color: rgba(0, 0, 0, .45) !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
        }

        /* ── Inline TOC nesting in main content ──────── */
        /* Sub-items that fixInlineTocLists() creates */
        #_html ol li ol {
            list-style: none;
            padding-left: 1.2em;
            margin: 0.1em 0 0.3em;
        }

        #_html ol li ol li {
            margin: 0.2em 0;
            color: rgba(0, 0, 0, .75);
        }

        /* ── Octicon anchor links on headings ─────────── */
        /* GitHub-style: icon appears on hover, links the heading */
        #_html h1 .anchor,
        #_html h2 .anchor,
        #_html h3 .anchor,
        #_html h4 .anchor,
        #_html h5 .anchor,
        #_html h6 .anchor {
            visibility: hidden;
            text-decoration: none;
            margin-left: -1.2em;
            padding-right: 0.3em;
            opacity: 0.6;
            position: relative;
            display: inline-block;
            width: 1em;
        }

        /* Keep anchor visible on heading hover AND when hovering the anchor itself */
        #_html h1:hover .anchor,
        #_html h2:hover .anchor,
        #_html h3:hover .anchor,
        #_html h4:hover .anchor,
        #_html h5:hover .anchor,
        #_html h6:hover .anchor,
        #_html .anchor:hover,
        #_html .anchor:focus {
            visibility: visible;
        }

        /* Give headings left-padding so the anchor icon sits INSIDE the heading box */
        #_html h1,
        #_html h2,
        #_html h3,
        #_html h4,
        #_html h5,
        #_html h6 {
            padding-left: 1.3em;
            scroll-margin-top: 60px;
        }

        #_html pre,
        #_html pre code {
            line-height: 1.45 !important;
        }

        .octicon-link {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: middle;
            /* Link icon via SVG mask */
            background-color: currentColor;
            -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0z'/></svg>");
            mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 .75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0z'/></svg>");
        }

        .markdown-body {
            flex: 1;
            max-width: 100%;
            padding-left: 2rem;
            padding-top: 1rem;
        }

        .bd-content {
            scroll-margin-top: 56px;
        }

        html {
            scroll-padding-top: 70px;
        }

        @media (max-width: 767.98px) {
            .bd-sidebar {
                display: none !important;
            }

            .bd-content {
                width: 100% !important;
                max-width: 100% !important;
                padding: 1rem !important;
            }

            #doc-topbar {
                flex-wrap: wrap;
                gap: 8px;
            }

            .doc-topbar-title {
                display: none;
            }
        }

        /* ── Print layout ─────────────────────────────── */
        @media print {

            .bd-sidebar,
            .resize-handle,
            #doc-topbar,
            #fab-top,
            #fab-bottom,
            .anchor {
                display: none !important;
            }

            .bd-content {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
            }

            #_html h1,
            #_html h2,
            #_html h3,
            #_html h4,
            #_html h5,
            #_html h6 {
                padding-left: 0 !important;
                border: none !important;
            }
        }

        /* ── Base typography ───────────────────────────── */
        html,
        body,
        .markdown-body,
        .bd-sidebar {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        html {
            scroll-padding-top: 70px;
        }

        /* ── Top nav bar ───────────────────────────────── */
        #doc-topbar {
            position: sticky;
            top: 0;
            z-index: 1050;
            background: #0d0e11;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            gap: 16px;
            border-bottom: 2px solid var(--va, #e1b66a);
            box-shadow: 0 2px 12px rgba(13, 14, 17, .35);
            width: 100%;
        }

        .doc-topbar-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--va, #e1b66a);
            text-decoration: none;
            font-size: .85em;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(225, 182, 106, .35);
            transition: background .2s;
            white-space: nowrap;
        }

        .doc-topbar-back:hover {
            background: rgba(225, 182, 106, .12);
            color: var(--va, #e1b66a);
        }

        .doc-topbar-logo img {
            height: 28px;
            display: block;
        }

        .doc-topbar-title {
            flex: 1;
            font-size: .88em;
            font-weight: 600;
            color: rgba(255, 255, 255, .75);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .doc-topbar-title:hover {
            color: #fff;
            text-decoration: underline;
        }

        .doc-topbar-badge {
            font-size: .7em;
            font-family: ui-monospace, monospace;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(225, 182, 106, .1);
            border: 1px solid rgba(225, 182, 106, .3);
            color: var(--va, #e1b66a);
            white-space: nowrap;
        }

        /* ── Sidebar refinements ───────────────────────── */
        .bd-sidebar {
            background: #fafbfc !important;
            border-right: 1px solid #e8ecf2 !important;
            padding-top: 0 !important;
        }

        .bd-sidebar-inner {
            padding: 1rem 0;
        }

        .bd-sidebar #toc-search {
            border-radius: 8px;
            border: 1px solid #d0d7de;
            font-size: .85em;
            box-shadow: none;
        }

        .bd-sidebar #toc-search:focus {
            border-color: #0d0e11;
            box-shadow: 0 0 0 3px rgba(13, 14, 17, .1);
        }

        .bd-sidebar a {
            font-size: .82rem !important;
            border-radius: 6px;
            margin: 1px 6px;
            padding: .3rem .75rem !important;
            transition: background .15s, color .15s;
        }

        .bd-sidebar a:hover {
            background: rgba(13, 14, 17, .06) !important;
            color: #0d0e11 !important;
        }

        .bd-sidebar a.active {
            color: #0d0e11 !important;
            background: rgba(13, 14, 17, .08) !important;
            border-right: 2px solid #0d0e11 !important;
            font-weight: 600 !important;
        }

        .toc-h2 {
            font-weight: 600 !important;
            font-size: .82rem !important;
        }

        .toc-h3 {
            font-weight: 400 !important;
        }

        /* ── Markdown body refinements ─────────────────── */
        .markdown-body {
            max-width: 880px !important;
            margin-left: auto !important;
            margin-right: auto !important;
            padding: 1.5rem 2.5rem 3rem !important;
            font-size: 15px !important;
            line-height: 1.7 !important;
            color: #1a2840 !important;
            background: transparent !important;
        }

        .markdown-body h1 {
            font-size: 1.9em;
            padding-bottom: .35em;
        }

        .markdown-body h2 {
            font-size: 1.35em;
            padding-bottom: .3em;
            border-bottom: 2px solid #e8ecf2;
            margin-top: 2.5rem;
        }

        .markdown-body h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 1em;
            background: #0d0e11;
            border-radius: 2px;
            margin-right: 10px;
            vertical-align: middle;
            margin-top: -2px;
        }

        .markdown-body h3 {
            font-size: 1.1em;
            margin-top: 1.8rem;
        }

        .markdown-body h4 {
            font-size: .95em;
            margin-top: 1.5rem;
            color: #3a4060;
        }

        /* Code blocks */
        .markdown-body pre {
            background: #f6f8fa !important;
            border: 1px solid #e8ecf2 !important;
            border-radius: 10px !important;
            padding: 1.1em 1.4em !important;
            font-size: 13px !important;
            line-height: 1.6 !important;
            overflow-x: auto !important;
        }

        .markdown-body code:not([class]) {
            background: rgba(13, 14, 17, .06) !important;
            color: #8a5a00 !important;
            border-radius: 5px !important;
            padding: .15em .45em !important;
            font-size: .88em !important;
        }

        /* Tables */
        .markdown-body table {
            border-collapse: separate !important;
            border-spacing: 0 !important;
            border-radius: 10px !important;
            overflow: hidden !important;
            border: 1px solid #e8ecf2 !important;
            font-size: .9em !important;
            width: 100% !important;
            margin: 1.25rem 0 !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .05) !important;
        }

        .markdown-body table th {
            background: #0d0e11 !important;
            color: #ffffff !important;
            font-weight: 600 !important;
            padding: 10px 14px !important;
        }

        .markdown-body table td {
            padding: 9px 14px !important;
            border-top: 1px solid #e8ecf2 !important;
            color: #1a2840 !important;
            background: #fff !important;
        }

        .markdown-body tr:nth-child(even) td {
            background: #fafbfc !important;
        }

        /* wide tables scroll sideways inside their own box */
        #_html .table-wrap { overflow-x: auto; max-width: 100%; margin: 1.25rem 0; border-radius: 10px; -webkit-overflow-scrolling: touch; box-shadow: 0 1px 4px rgba(0, 0, 0, .05); }
        #_html .table-wrap > table { width: 100% !important; min-width: min-content; max-width: none !important; margin: 0 !important; display: table !important; box-shadow: none !important; }

        /* Blockquotes */
        .markdown-body blockquote {
            border-left: 4px solid var(--va, #e1b66a) !important;
            background: rgba(225, 182, 106, .06) !important;
            border-radius: 0 8px 8px 0 !important;
            padding: .75em 1.2em !important;
            color: #3a4060 !important;
        }

        /* hr */
        .markdown-body hr {
            border: none !important;
            border-top: 1px solid #e8ecf2 !important;
            margin: 2.5rem 0 !important;
        }

        /* Mermaid */
        .mermaid {
            text-align: center;
            margin: 2rem 0;
        }

        /* Stampa */
        @media print {

            #doc-topbar,
            .bd-sidebar {
                display: none !important;
            }

            .bd-content {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
            }

            .markdown-body {
                padding: 0 !important;
            }

            @page {
                size: A4;
                margin: 15mm 15mm 25mm 15mm;
            }
        }

        /* Error box */
        .error-message {
            color: #cf222e;
            padding: 20px;
            border: 1px solid #cf222e;
            border-radius: 6px;
            background: #ffebe9;
        }

        .error-message h3 {
            margin-top: 0;
            color: #cf222e;
        }

        /* ── Footnotes cleanup ────────────────────────── */
        #_html .footnotes-sep {
            display: none !important;
        }

        #_html h1:has(+ .footnotes-sep),
        #_html h1:has(+ .footnotes),
        #_html h2:has(+ .footnotes-sep),
        #_html h2:has(+ .footnotes) {
            border-bottom: none !important;
            padding-bottom: 0 !important;
        }

        /* Footnote list items: prevent bold bleed from leading <strong> term */
        #_html .footnotes ol li,
        #_html .footnotes ol li p,
        #_html section.footnotes ol li,
        #_html section.footnotes ol li p {
            font-weight: 400 !important;
        }

        /* Keep the leading term (first <strong> in a footnote) at normal bold weight */
        #_html .footnotes ol li > p > strong:first-child,
        #_html .footnotes ol li > strong:first-child,
        #_html section.footnotes ol li > p > strong:first-child,
        #_html section.footnotes ol li > strong:first-child {
            font-weight: 600 !important;
        }

        /* ── Floating nav FABs ─────────────────────────── */
        .fab-nav {
            position: fixed;
            right: 24px;
            z-index: 1060;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #fab-top {
            position: fixed;
            right: 24px;
            bottom: 74px;
            z-index: 1060;
        }

        #fab-bottom {
            position: fixed;
            right: 24px;
            bottom: 20px;
            z-index: 1060;
        }

        .fab-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0e11;
            color: #ffffff;
            box-shadow: 0 3px 12px rgba(13, 14, 17, .35);
            opacity: 1;
            transition: opacity .25s ease, transform .2s ease, background .15s;
            text-decoration: none;
        }

        .fab-btn:hover {
            background: #3a3c44;
            transform: scale(1.1);
        }

        .fab-btn.fab-hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.7);
        }

        /* ── Hamburger settings menu ───────────────────── */
        .settings-hamburger {
            position: relative;
            margin-left: auto;
        }

        .settings-hamburger-btn {
            background: transparent;
            border: 1px solid rgba(225, 182, 106, .35);
            color: var(--va, #e1b66a);
            font-size: 1.3rem;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s, transform .2s;
            line-height: 1;
        }

        .settings-hamburger-btn:hover {
            background: rgba(225, 182, 106, .12);
            transform: scale(1.08);
        }

        .settings-hamburger-btn.active {
            background: rgba(225, 182, 106, .18);
        }

        .settings-panel {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: #0d0e11;
            border: 1px solid rgba(225, 182, 106, .3);
            border-radius: 12px;
            padding: 16px 20px;

                    }
                    if (contentLength) {
                        const bytes = parseInt(contentLength, 10);
                        if (!isNaN(bytes)) {
                            httpMeta.size = bytes > 1024 * 1024
                                ? (bytes / (1024 * 1024)).toFixed(2) + ' MB'
                                : (bytes / 1024).toFixed(1) + ' KB';
                        }
                    }
                    if (amzVersion && amzVersion !== 'null') {
                        // short version string for display
                        httpMeta.version = amzVersion.length > 12 ? amzVersion.substring(0, 12) + '...' : amzVersion;
                        httpMeta.fullVersion = amzVersion;
                    }
                }

                let markdownText = await response.text();

                // Estrai e parsa il frontmatter YAML
                const { frontmatter, body } = parseFrontmatter(markdownText);
                markdownText = body;

                // Titolo: frontmatter.title ha priorità sul nome file
                const h1 = /^#\s+(.+)$/m.exec(markdownText);
                const pageTitle = frontmatter.title || (h1 ? h1[1].replace(/[*_`]/g, '').trim() : fileBaseName);
                document.title = pageTitle;
                document.getElementById('page-title').textContent = pageTitle;

                // Setup Markdown-it (full compiler features)
                const md = new MarkdownIt({
                    html: true,
                    linkify: true,
                    typographer: true,
                    breaks: false,
                    highlight: function (str, lang) {
                        if (lang === 'mermaid') return str;
                        if (lang && window.hljs.getLanguage(lang)) {
                            try { return window.hljs.highlight(str, { language: lang }).value; } catch (__) { }
                        }
                        return '';
                    }
                })
                    .use(emoji)
                    .use(sub)
                    .use(sup)
                    .use(footnote)
                    .use(deflist)
                    .use(abbr)
                    .use(ins)
                    .use(mark)
                    .use(taskLists)
                    .use(anchor, {
                        // GitHub's exact slugify algorithm
                        slugify: s => String(s).toLowerCase()
                            .replace(/ /g, '-')
                            .replace(/[^\w-]/g, '')
                    });

                // Rendering HTML da Markdown
                const rawHtml = md.render(markdownText);

                // Configura DOMPurify (script non ammessi: questa pagina e' sulla stessa origine del dispositivo)
                const purifyConfig = {
                    ADD_TAGS: ['iframe', 'style'],
                    ADD_ATTR: ['allow', 'allowfullscreen', 'frameborder', 'scrolling', 'target']
                };
                const cleanHtml = DOMPurify.sanitize(rawHtml, purifyConfig);

                // Inietta nel content
                document.getElementById('_html').innerHTML = cleanHtml;
                document.querySelectorAll('#_html table').forEach(t => { const w = document.createElement('div'); w.className = 'table-wrap'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
                fixLinks(document.getElementById('_html'), /^https?:/i.test(file) ? file : new URL(file, location.href).href);

                // Inietta il banner frontmatter sotto il primo H1
                const bannerHtml = buildFrontmatterBanner(frontmatter);
                if (bannerHtml) {
                    const firstH1 = document.querySelector('#_html h1');
                    if (firstH1) {
                        firstH1.insertAdjacentHTML('afterend', bannerHtml);
                    } else {
                        // Nessun H1: inserisci all'inizio del contenuto
                        document.getElementById('_html').insertAdjacentHTML('afterbegin', bannerHtml);
                    }
                    // Toggle expand/collapse
                    const toggle = document.getElementById('fm-toggle');
                    const details = document.getElementById('fm-details');
                    const banner = document.getElementById('fm-banner');
                    if (toggle && details) {
                        toggle.addEventListener('click', () => {
                            const isOpen = banner.classList.toggle('open');
                            // Animate max-height
                            if (isOpen) {
                                details.style.maxHeight = details.scrollHeight + 'px';
                            } else {
                                details.style.maxHeight = '0';
                            }
                        });
                    }
                }

                // Aggiungi i metadati HTTP come footer alla fine del documento
                if (httpMeta && (httpMeta.lastModified || httpMeta.size)) {
                    let footerParts = [];
                    if (httpMeta.lastModified) footerParts.push(`<span><strong>Ultimo aggiornamento:</strong> ${httpMeta.lastModified}</span>`);
                    if (httpMeta.size) footerParts.push(`<span><strong>Dimensione del documento:</strong> ${httpMeta.size}</span>`);

                    const footerHtml = `<div class="fm-http-meta-footer">${footerParts.join('')}</div>`;
                    document.getElementById('_html').insertAdjacentHTML('beforeend', footerHtml);
                }

                // Post-processing: aggiungi anchor octicon-link a tutti gli heading
                document.querySelectorAll('#_html h1, #_html h2, #_html h3, #_html h4, #_html h5, #_html h6').forEach(h => {
                    if (!h.id || h.querySelector('.anchor')) return; // salta se già presente
                    const a = document.createElement('a');
                    a.className = 'anchor';
                    a.setAttribute('name', h.id);
                    a.setAttribute('tabindex', '-1');
                    a.href = '#' + h.id;
                    a.innerHTML = '<span class="octicon octicon-link"></span>';
                    h.setAttribute('tabindex', '-1');
                    h.insertBefore(a, h.firstChild);
                });

                // Processa Mermaid
                let hasMermaid = false;
                document.querySelectorAll('code.language-mermaid').forEach((block) => {
                    hasMermaid = true;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = block.textContent;
                    block.parentNode.replaceChild(div, block);
                });

                if (hasMermaid) {
                    // Mermaid e MathJax sono pesanti: vengono scaricati solo se servono davvero.
                    await loadLazyLibrary('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js', () => Boolean(window.mermaid));
                    if (window.mermaid) {
                        window.mermaid.initialize({ startOnLoad: false, theme: window.__dark ? 'dark' : 'default' });
                        await window.mermaid.run();
                    }
                }

                // Avvia MathJax se ci sono blocchi matematici nel DOM
                if (hasMathMarkup(document.getElementById('_html'))) {
                    await loadLazyLibrary('https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js', () => Boolean(window.MathJax && window.MathJax.typesetPromise));
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        try {
                            await window.MathJax.typesetPromise([document.getElementById('_html')]);
                        } catch (e) { console.warn('MathJax error:', e); }
                    }
                }

                // Genera TOC e ScrollSpy
                buildTOCAndSpy();

                // Ristruttura i sotto-punti dell'indice inline (es. 3.1. link 3.2. link ...)
                // che markdown-it mette come testo inline dentro un singolo <li> anziché
                // come <ol> annidate.
                fixInlineTocLists();

                // Scroll to URL hash after async content is ready.
                // The browser fires the native hash-scroll before fetch() returns, so we
                // must do it manually. We try both the raw hash and the sanitized variant
                // (e.g. #36-... → #s36-...) in case the ID starts with a digit.
                if (window.location.hash) {
                    try {
                        const rawId = decodeURIComponent(window.location.hash.slice(1));
                        const safeId = sanitizeId(rawId);
                        let target = document.getElementById(safeId) || document.getElementById(rawId);

                        // Fallback: If direct lookup fails, try matching against TOC links.
                        // Sometimes the Markdown slugger skips dots (e.g. 3.6 -> 36) generating
                        // a hash like #36-..., while our sanitizer sees it as starting with a digit.
                        // By checking if the TOC link ends with the hash, we can find the real ID.
                        if (!target) {
                            const tocLinks = document.querySelectorAll('#toc-nav a');
                            for (let link of tocLinks) {
                                const href = link.getAttribute('href'); // e.g '#s36-...'
                                if (href && (href.endsWith(rawId) || href.endsWith(safeId))) {
                                    target = document.getElementById(href.slice(1));
                                    break;
                                }
                            }
                        }

                        if (target) {
                            // Small delay to let layout settle after mermaid/hljs rendering
                            setTimeout(() => {
                                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }, 300);
                        }
                    } catch (e) { console.warn(e); }
                }

            } catch (error) {
                document.getElementById('_html').innerHTML = `
                    <div class="error-message">
                        <h3>Manuale non disponibile</h3>
                        <p>${error.message}</p>
                        <hr>
                        <p>Il manuale viene scaricato da GitHub e visualizzato con librerie caricate da internet: serve una connessione dal browser.</p>
                        <p><a href="https://github.com/Ircama/esp32-sony-slink#readme" target="_blank" rel="noopener">Apri il manuale su GitHub</a></p>
                    </div>
                `;
            }
        }

        // Ristruttura le liste inline del TOC: markdown-it mette sotto-punti come
        // "3.1. <a>link</a>" come testo inside il <li> padre, non come <ol> annidata.
        // Questa funzione li trasforma in una struttura <ol><li> correttamente annidata.
        function fixInlineTocLists() {
            document.querySelectorAll('#_html ol > li').forEach(li => {
                const allAnchors = Array.from(li.querySelectorAll('a'));
                if (allAnchors.length <= 1) return; // Nothing to restructure

                const firstAnchor = allAnchors[0];
                const segments = [];
                let currentLabel = '';
                let pastFirst = false;
                const toRemove = [];

                Array.from(li.childNodes).forEach(node => {
                    if (!pastFirst) {
                        if (node === firstAnchor) pastFirst = true;
                        return;
                    }
                    toRemove.push(node);
                    if (node.nodeType === Node.TEXT_NODE) {
                        currentLabel += node.textContent;
                    } else if (node.nodeName === 'A') {
                        segments.push({ label: currentLabel.trim(), link: node });
                        currentLabel = '';
                    }
                });

                if (segments.length === 0) return;

                // Remove old inline content after firstAnchor
                toRemove.forEach(n => li.contains(n) && li.removeChild(n));

                // Build nested <ol>
                const subOl = document.createElement('ol');
                subOl.style.cssText = 'padding-left:1.2em;margin:0.2em 0 0.3em;';
                segments.forEach(({ label, link }) => {
                    const subLi = document.createElement('li');
                    subLi.style.listStyle = 'none';
                    if (label) subLi.appendChild(document.createTextNode(label + ' '));
                    if (link) subLi.appendChild(link);
                    subOl.appendChild(subLi);
                });
                li.appendChild(subOl);
            });
        }

        function buildTOCAndSpy() {
            const container = document.getElementById("toc-nav");
            const headings = document.querySelectorAll("#_html h1, #_html h2, #_html h3, #_html h4");

            const searchInput = document.getElementById("toc-search");
            const tocLinks = [];

            // Per tenere traccia di ID duplicati
            const idCounts = {};
            // Map from original ID → sanitized ID (only populated when they differ)
            const idMap = {};

            headings.forEach((heading) => {
                // Genera o recupera ID base
                let targetId = heading.id;
                if (!targetId) {
                    // Cerca un anchor implicito
                    const anchor = heading.querySelector("a.anchor");
                    if (anchor && anchor.name) {
                        targetId = anchor.name;
                    } else {
                        targetId = heading.innerText.toLowerCase().replace(/[^a-z0-9]+/g, "-");
                    }
                }

                // Gestisci duplicati
                if (idCounts[targetId]) {
                    idCounts[targetId]++;
                    targetId = `${targetId}-${idCounts[targetId]}`;
                } else {
                    idCounts[targetId] = 1;
                }

                // Sanitize per un utilizzo sicuro da parte di querySelector / CSS (usati dallo scrollSpy)
                const safeId = sanitizeId(targetId);
                // Track renamed IDs so we can fix inline links in the document body
                if (safeId !== targetId) {
                    idMap[targetId] = safeId;
                }
                heading.id = safeId;

                // Salta l'H1 (è già il titolo del documento, usiamo solo H2, H3, H4 per il menu)
                const level = parseInt(heading.tagName.substring(1));
                if (level === 1) return;

                // Crea Link nel Menu
                const link = document.createElement("a");
                link.href = "#" + safeId;

                // Clona e pulisci il testo (rimuovi icone di anchor se ci sono)
                let clone = heading.cloneNode(true);
                let anchors = clone.querySelectorAll(".anchor");
                anchors.forEach(a => a.remove());
                link.innerText = clone.innerText.trim();

                link.className = `nav-link toc-h${level}`;

                container.appendChild(link);
                tocLinks.push({ element: link, text: link.innerText.toLowerCase() });
            });

            // Fix inline links in the document body that point to renamed (sanitized) IDs.
            // This covers the numbered TOC list that marked.js renders directly from the .md.
            if (Object.keys(idMap).length > 0) {
                document.querySelectorAll('#_html a[href^="#"]').forEach(function (a) {
                    const targetUri = a.getAttribute('href').slice(1); // strip leading '#'
                    if (!targetUri) return;

                    try {
                        const target = decodeURIComponent(targetUri);
                        if (idMap[target]) {
                            a.setAttribute('href', '#' + idMap[target]);
                        }
                    } catch (e) {
                        // ignore malformed URIs
                    }
                });
            }

            // Ricerca nella TOC
            searchInput.addEventListener("input", function (e) {
                const term = e.target.value.toLowerCase();
                tocLinks.forEach(item => {
                    if (item.text.includes(term)) {
                        item.element.classList.remove('toc-hidden');
                    } else {
                        item.element.classList.add('toc-hidden');
                    }
                });
            });

            // Sidebar click: scroll heading below the sticky topbar
            const TOPBAR_OFFSET = 64; // px below viewport top
            container.addEventListener('click', function (e) {
                const link = e.target.closest('a[href^="#"]');
                if (!link) return;
                const targetId = link.getAttribute('href').slice(1);
                const target = document.getElementById(targetId);
                if (!target) return;
                e.preventDefault();
                const top = target.getBoundingClientRect().top + window.scrollY - TOPBAR_OFFSET;
                window.scrollTo({ top: top, behavior: 'smooth' });
                // Update URL hash without triggering default scroll
                history.pushState(null, '', '#' + targetId);
            });

            // Inizializza Bootstrap ScrollSpy per l'evidenziazione automatica
            const scrollSpyObj = bootstrap.ScrollSpy.getInstance(document.body);
            if (scrollSpyObj) {
                scrollSpyObj.refresh();
            } else {
                new bootstrap.ScrollSpy(document.body, {
                    target: "#toc-nav"
                });
            }

            // Auto-scroll #toc-nav to keep the active TOC link in view.
            // NOTE: after the flex refactor .bd-sidebar has overflow:hidden — only #toc-nav scrolls.
            document.body.addEventListener('activate.bs.scrollspy', function (e) {
                const activeItem = e.relatedTarget; // the <a> in #toc-nav that became active
                const tocNav = document.getElementById('toc-nav');
                if (!activeItem || !tocNav) return;

                const itemRect = activeItem.getBoundingClientRect();
                const containerRect = tocNav.getBoundingClientRect();
                const MARGIN = 80; // px of context to keep above/below the active item

                // Below visible area → scroll down
                if (itemRect.bottom > containerRect.bottom - MARGIN) {
                    tocNav.scrollTop += itemRect.bottom - containerRect.bottom + MARGIN;
                }
                // Above visible area → scroll up
                else if (itemRect.top < containerRect.top + MARGIN) {
                    tocNav.scrollTop -= containerRect.top - itemRect.top + MARGIN;
                }
            });
        }

        // Avvio procedura on load
        window.addEventListener('load', loadMarkdown);

        // ── Floating nav buttons ─────────────────────────────────────
        (function () {
            const btnTop = document.getElementById('fab-top');
            const btnBottom = document.getElementById('fab-bottom');
            const THRESHOLD = 120; // px from top/bottom to hide the respective button

            function updateFabs() {
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const docHeight = document.documentElement.scrollHeight;
                const winHeight = window.innerHeight;
                const distBottom = docHeight - scrollTop - winHeight;

                // Hide «top» when near the top
                btnTop.classList.toggle('fab-hidden', scrollTop < THRESHOLD);
                // Hide «bottom» when near the bottom
                btnBottom.classList.toggle('fab-hidden', distBottom < THRESHOLD);
            }

            btnTop.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            btnBottom.addEventListener('click', () => {
                window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
            });

            window.addEventListener('scroll', updateFabs, { passive: true });
            updateFabs(); // run once on load
        })();

        // ── Sidebar resize handle drag logic ──────────────
        (function () {
            const handle = document.getElementById('sidebar-resize');
            const sidebar = document.querySelector('.bd-sidebar');
            if (!handle || !sidebar) return;
            const setW = x => document.documentElement.style.setProperty('--sidebar-w', Math.max(150, Math.min(window.innerWidth * 0.6, x)) + 'px');
            handle.addEventListener('pointerdown', e => {
                e.preventDefault();
                handle.setPointerCapture(e.pointerId);
                handle.classList.add('active');
                document.body.style.userSelect = 'none';
            });
            handle.addEventListener('pointermove', e => {
                if (!handle.hasPointerCapture(e.pointerId)) return;
                setW(e.clientX - handle.offsetWidth / 2);
            });
            const end = e => { handle.classList.remove('active'); document.body.style.userSelect = ''; };
            handle.addEventListener('pointerup', end);
            handle.addEventListener('pointercancel', end);
            handle.addEventListener('dblclick', () => document.documentElement.style.removeProperty('--sidebar-w'));
        })();

        // ── Phone: index overlay, opened by pressing (or swiping) near the left edge ──
        (function () {
            const edge = document.getElementById('toc-edge'), back = document.getElementById('toc-backdrop');
            const open = () => document.body.classList.add('toc-open'), close = () => document.body.classList.remove('toc-open');
            edge.addEventListener('pointerdown', e => { e.preventDefault(); open(); });
            back.addEventListener('pointerdown', e => { e.preventDefault(); close(); });
            document.getElementById('toc-nav').addEventListener('click', e => { if (e.target.closest('a')) close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
            matchMedia('(min-width: 768px)').addEventListener('change', e => { if (e.matches) close(); });
        })();

        // ── Settings hamburger menu ──────────────────────────────
        (function () {
            const btn = document.getElementById('settings-btn');
            const panel = document.getElementById('settings-panel');
            const toggleNavbar = document.getElementById('toggle-navbar');
            const togglePadding = document.getElementById('toggle-padding');

            // Open / close panel
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const isOpen = panel.classList.toggle('open');
                btn.classList.toggle('active', isOpen);
            });

            // Close on outside click
            document.addEventListener('click', function (e) {
                if (!panel.contains(e.target) && e.target !== btn) {
                    panel.classList.remove('open');
                    btn.classList.remove('active');
                }
            });

            // Toggle: Navbar (sidebar)
            toggleNavbar.addEventListener('change', function () {
                document.body.classList.toggle('sidebar-hidden', !this.checked);
                // Refresh ScrollSpy when sidebar toggled
                const spy = bootstrap.ScrollSpy.getInstance(document.body);
                if (spy) spy.refresh();
            });

            // Toggle: Content side padding
            togglePadding.addEventListener('change', function () {
                document.body.classList.toggle('no-content-padding', !this.checked);
            });

        })();

    </script>
</body>
